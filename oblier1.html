<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouveau mot de passe</title>

    <link rel="stylesheet" href="page1.css">

</head>


<body>

    <div class="background-logo">

        <img src="image/logo.png" alt="Elite Robotique">

    </div>


    <header>

        <div class="brand">

            <img src="../image/logo.png" alt="Elite Robotique">

            <span>elite robotique</span>

        </div>

    </header>


    <main>

        <div class="login-area">


            <div class="welcome">

                <h1>Nouveau mot de passe</h1>

                <p>Créez votre nouveau mot de passe</p>

            </div>


            <section class="login-box">


                <form
                    id="formPassword"
                    onsubmit="return modifierMotDePasse()"
                >


                    <div class="form-group">

                        <label for="mdp">
                            Mot de passe
                        </label>

                        <input
                            type="password"
                            id="mdp"
                            name="mdp"
                            placeholder="Entrez votre mot de passe"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirm">
                            Confirmer mot de passe
                        </label>

                        <input
                            type="password"
                            id="confirm"
                            name="confirm"
                            placeholder="Confirmez votre mot de passe"
                        >

                    </div>


                    <input
                        type="submit"
                        value="Créer le compte"
                        class="connexion"
                    >

                </form>


            </section>

        </div>

    </main>


    <footer>

        <p>
            Avenue Hédi Chaker — dessus de pharmacie de nuit
        </p>

    </footer>


    <script src="page1.js"></script>

</body>

</html>

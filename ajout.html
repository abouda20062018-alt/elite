<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte</title>

    <link rel="stylesheet" href="style.css">
    <script src="page1.js"></script>
</head>

<body>
    <header>

        <div class="brand">

            <img
                src="C:\Users\sedik\Desktop\image\logo.png"
                alt="Elite Robotique"
            >

            <span>elite robotique</span>

        </div>

    </header>


    <main>

        <div class="login-area">


            <div class="welcome">

                <h1>Créer un compte</h1>

                <p>Créer votre nouvel espace utilisateur</p>

            </div>
            <section class="login-box">

                <form action="" onsubmit="return verf()">

                    <div class="form-group">

                        <label for="nom">
                            Nom
                        </label>

                        <input
                            type="text"
                            id="nom"
                            name="nom"
                            placeholder="Entrez votre nom"
                        >

                    </div>


                    <div class="form-group">

                        <label for="pre">
                            Prénom
                        </label>

                        <input
                            type="text"
                            id="pre"
                            name="pre"
                            placeholder="Entrez votre prénom"
                        >

                    </div>


                    <div class="form-group">

                        <label for="mail">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="mail"
                            name="mail"
                            placeholder="Entrez votre e-mail"
                        >

                    </div>


                    <div class="form-group">

                        <label for="mdp">
                            Mot de passe
                        </label>

                        <input
                            type="password"
                            id="mdp"
                            name="mdp"
                            placeholder="Entrez votre mot de passe"
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirm">
                            Confirmer le mot de passe
                        </label>

                        <input
                            type="password"
                            id="confirm"
                            name="confirm"
                            placeholder="Confirmez votre mot de passe"
                        >

                    </div>


                    <input
                        type="submit"
                        value="Créer le compte"
                        class="connexion"
                    >

                </form>

            </section>

        </div>

    </main>


    <footer>

        <p>
            Avenue Hédi Chaker — dessus de pharmacie de nuit
        </p>

    </footer>

</body>

</html>
